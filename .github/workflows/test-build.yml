name: Test build

# A test tag (test-*) or a manual run builds the Windows and Linux setups the way release.yml's windows and linux jobs
# do, and keeps each as a workflow artifact, for one person to install and try. It never publishes a release:
# release.yml does that, from a v* tag that matches VERSION. The steps below are those jobs', so change the two together.

on:
  push:
    tags: ["test-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # The tag, or the branch of a manual run, names the zip and the artifact. Any character outside A-Za-z0-9._- becomes
      # "-": a branch has slashes, and a pipe or a quote is refused by the artifact upload or by NTFS. The ref goes in
      # through env, so Bash never parses its text.
      - name: Name the build
        id: name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "name=$(printf '%s' "$REF_NAME" | LC_ALL=C tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # make_release.py: tarfile reads the MSYS2 .zst packages
      - uses: astral-sh/setup-uv@v6   # make_release.py installs the bundled Python's packages with uv
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"   # the shader translator (NativeAOT; MSVC and vswhere come with the image)
      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: toolchain/release-dl
          key: release-dl-windows-${{ hashFiles('tools/make_release.py') }}
          restore-keys: release-dl-windows-
      - name: Check content
        run: python tools/check_content.py
      - name: Build the shader translator
        run: python tools/build_xlate.py
      - name: Build the release folder and zip
        timeout-minutes: 25   # about a minute warm; above check_bundle's own limits. v0.1.8 hung here with no way to see where
        env:
          PYTHONUNBUFFERED: "1"   # a killed step keeps its log only up to what Python has flushed
          ZIP: build/release/XC2-Setup-${{ steps.name.outputs.name }}-windows.zip
        run: python tools/make_release.py --out build/release/XC2-Setup --zip $env:ZIP
      - uses: actions/upload-artifact@v4
        with:
          name: XC2-Setup-${{ steps.name.outputs.name }}
          path: build/release/XC2-Setup-${{ steps.name.outputs.name }}-windows.zip
          if-no-files-found: error
          compression-level: 0   # already a zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      # The tag, or the branch of a manual run, names the AppImage and the artifact. The same normalization as the
      # windows job's name step: the ref goes in through env, and characters outside A-Za-z0-9._- become "-".
      - name: Name the build
        id: name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "name=$(printf '%s' "$REF_NAME" | LC_ALL=C tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
      - name: Free disk space   # the LLVM release and the sniper SDK sysroot unpack to several GB
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make pkg-config xvfb xauth fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Pillow   # make_release_linux.py turns xc2.ico into the window's PNG
        run: python -m pip install pillow==12.3.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: toolchain/release-dl
          key: release-dl-linux-${{ hashFiles('tools/make_release.py', 'tools/make_release_linux.py', 'tools/build_game.py') }}
          restore-keys: release-dl-linux-
      - name: Check content
        run: python tools/check_content.py
      # Tk needs a display for the bundle check and the window's --selftest
      - name: Build the release folder and AppImage
        env:
          APPIMAGE: build/release/XC2-Setup-${{ steps.name.outputs.name }}-linux.AppImage
        run: xvfb-run -a python tools/make_release_linux.py --out build/release/XC2-Setup-linux --appimage "$APPIMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: XC2-Setup-${{ steps.name.outputs.name }}-linux
          path: build/release/XC2-Setup-${{ steps.name.outputs.name }}-linux.AppImage
          if-no-files-found: error
