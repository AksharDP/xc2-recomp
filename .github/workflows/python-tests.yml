name: Python tests

# Installer, generator and mod-tool checks without game files. The window tests use a software virtual display;
# the main check uses the Python and packages the setup ships (tools/make_release.py).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer_gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk and the virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install -r tools/requirements-installer.txt
      - name: Check installer language choices and update handoff
        run: xvfb-run -a python tests/installer_gui_test.py

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r tools/requirements-installer.txt
      - name: Run the tests
        run: |
          failed=
          for t in build_game_metadata exefs_patches installer lift_cache mod_code prompts_text regions selfupdate; do
            echo "== tests/${t}_test.py"
            python "tests/${t}_test.py" || failed="$failed $t"
          done
          test -z "$failed" || { echo "failed:$failed"; exit 1; }

  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Check Controls key edits without game files
        env:
          CC: clang
        run: python tests/input_key_move_test.py
