name: Python tests

# The tests of the installer, the generator and the mod tools that need no game files, compiler or window, on the Python
# and the packages the setup ships (tools/make_release.py).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r tools/requirements-installer.txt
      - name: Run the tests
        run: |
          failed=
          for t in build_game_metadata exefs_patches installer lift_cache mod_code package_build prompts_text regions selfupdate; do
            echo "== tests/${t}_test.py"
            python "tests/${t}_test.py" || failed="$failed $t"
          done
          test -z "$failed" || { echo "failed:$failed"; exit 1; }

  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Check Controls key edits without game files
        env:
          CC: clang
        run: python tests/input_key_move_test.py
