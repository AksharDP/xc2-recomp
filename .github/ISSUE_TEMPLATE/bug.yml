name: Bug report
description: Something breaks, crashes or looks wrong.
body:
  - type: markdown
    attributes:
      value: |
        Do not attach or link game files, keys, firmware or builds. Issues that do are closed. Your own save file is
        fine; the Save file field below asks for it.
  - type: input
    id: version
    attributes:
      label: Version
      description: The title line of the settings menu (F1), for example "XC2 Recomp 0.1.0, game 3.0.1".
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU, driver and Windows version
      description: Copy system info in the menu's Advanced tab puts them on the clipboard.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened and how to reproduce it
    validations:
      required: true
  - type: textarea
    id: save
    attributes:
      label: Save file
      description: |
        A save standing where the problem shows is how we test textures in that part of the game. Drag
        `profile\save\<account id>\bf2savefile.sav` from the install folder into this box (GitHub turns it into a
        link), or paste a link to it. Add `bf2option.sav` too when the settings matter. Write none if the problem
        happens before any save can load.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach logs\xc2.log from the folder of xc2.exe. After a crash, copy it before you start the game again.
